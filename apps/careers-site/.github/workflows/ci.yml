name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Start the site and check it
        env:
          CRM_API_URL: https://crm.example.com
          CAREERS_ORG: ${{ vars.CAREERS_ORG || 'acme-recruiting' }}
        run: |
          node serve.mjs &
          sleep 3
          curl -fsS http://localhost:3100/health
          curl -fsS -o /dev/null http://localhost:3100/jobs
