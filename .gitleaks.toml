# Gitleaks configuration: the default rules, plus an allowlist for test fixtures.
# The only findings so far were made-up values in unit tests (e.g. "session-secret-value-1234", "key-12345678");
# no real credential is stored in the repository (real ones live in .env files, which are not committed).
title = "SaaS CRM Recruit"

[extend]
useDefault = true

[allowlist]
description = "Fake values used by unit tests"
paths = [
  '''.*\.spec\.ts$''',
  '''.*\.test\.tsx?$''',
]
